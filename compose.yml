services:
  diskusage:
    build: .
    container_name: diskusage
    restart: unless-stopped
    mem_limit: 2g
    environment:
      # "system" is the host root filesystem (non-recursive bind — other
      # mounted filesystems, /proc, /sys etc. appear empty, so this only
      # covers the actual system/nvme drive, not a duplicate of "seagate").
      - ROOTS=system:/data/system,seagate:/data/seagate
    volumes:
      - /:/data/system:ro
      - /mnt/seagate:/data/seagate:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
