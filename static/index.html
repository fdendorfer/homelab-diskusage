<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Disk Usage</title>
<style>
  :root { color-scheme: dark light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #14161a;
    color: #e6e6e6;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #1c1f24;
    border-bottom: 1px solid #2a2e35;
    flex-wrap: wrap;
  }
  select, button {
    background: #2a2e35;
    color: #e6e6e6;
    border: 1px solid #3a3f47;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover, select:hover { background: #343941; }
  #status { font-size: 12px; color: #9aa0a8; margin-left: auto; }
  #breadcrumb {
    padding: 8px 14px;
    font-size: 13px;
    background: #181b20;
    border-bottom: 1px solid #2a2e35;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  #breadcrumb span { cursor: pointer; color: #7fb0ff; }
  #breadcrumb span:hover { text-decoration: underline; }
  #breadcrumb .sep { color: #555; cursor: default; }
  #breadcrumb .sep:hover { text-decoration: none; }
  #treemap {
    position: relative;
    flex: 1;
    margin: 10px;
    overflow: hidden;
  }
  .cell {
    position: absolute;
    border: 1px solid rgba(0,0,0,0.35);
    overflow: hidden;
    font-size: 11px;
    padding: 2px 4px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .cell:hover { outline: 2px solid #fff; outline-offset: -2px; z-index: 5; }
  #empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #666;
    font-size: 14px;
  }
  #listView {
    flex: 1;
    margin: 10px;
    overflow: auto;
  }
  table.list {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.list th, table.list td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid #23262c;
  }
  table.list th {
    color: #9aa0a8;
    font-weight: 600;
    position: sticky;
    top: 0;
    background: #14161a;
  }
  table.list td.size { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.list td.mtime { text-align: right; white-space: nowrap; color: #9aa0a8; }
  table.list tr.dir { cursor: pointer; }
  table.list tr.dir:hover { background: #1c1f24; }
  table.list td.bar-cell { width: 30%; }
  .bar-track { background: #23262c; border-radius: 3px; height: 8px; overflow: hidden; }
  .bar-fill { background: #4a7fd6; height: 100%; }
  .icon { display: inline-block; width: 1.2em; margin-inline-end: .5rem; }
  #showBlocksBtn[aria-pressed="true"] { background: #3a5c8f; border-color: #4a7fd6; }
  #showBlocksBtn[aria-pressed="true"]:hover { background: #416aa3; }
</style>
</head>
<body>
<header>
  <select id="rootSelect"></select>
  <button id="rescanBtn">Rescan</button>
  <button id="showBlocksBtn" aria-pressed="true">Blocks</button>
  <span id="status">loading...</span>
</header>
<div id="breadcrumb"></div>
<div id="treemap"><div id="empty">loading...</div></div>
<div id="listView" style="display:none"></div>

<script>
let currentRootLabel = null;
let fullTree = null;
let pathStack = []; // array of nodes from root to current view
let showBlocks = true;
const treeCache = {}; // label -> { lastScan, tree } — avoids re-fetching/parsing a
                       // multi-megabyte tree on every switch back to an already-scanned root

function fmtBytes(n) {
  if (n < 1024) return n + " B";
  const units = ["KB","MB","GB","TB","PB"];
  let u = -1;
  do { n /= 1024; u++; } while (n >= 1024 && u < units.length - 1);
  return n.toFixed(n < 10 ? 2 : 1) + " " + units[u];
}

function fmtMTime(unixSeconds) {
  if (!unixSeconds) return "—";
  return new Date(unixSeconds * 1000).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadRoots() {
  const roots = await fetchJSON("/api/roots");
  const sel = document.getElementById("rootSelect");
  sel.innerHTML = "";
  for (const r of roots) {
    const opt = document.createElement("option");
    opt.value = r.label;
    opt.textContent = r.label;
    sel.appendChild(opt);
  }
  sel.onchange = () => selectRoot(sel.value);
  if (roots.length > 0) selectRoot(roots[0].label);
}

async function selectRoot(label) {
  currentRootLabel = label;
  fullTree = null;
  pathStack = [];
  renderBreadcrumb();
  setStatus("checking...");
  const st = await fetchJSON("/api/status?root=" + encodeURIComponent(label));
  if (st.hasData) {
    await loadData();
  } else {
    await triggerScan();
  }
}

async function triggerScan() {
  setStatus("scanning...");
  document.getElementById("treemap").innerHTML = '<div id="empty">scanning, this can take a while on first run...</div>';
  await fetchJSON("/api/scan?root=" + encodeURIComponent(currentRootLabel), { method: "POST" });
  pollStatus();
}

async function pollStatus() {
  const st = await fetchJSON("/api/status?root=" + encodeURIComponent(currentRootLabel));
  if (st.scanning) {
    setStatus("scanning...");
    setTimeout(pollStatus, 800);
    return;
  }
  await loadData();
}

async function loadData() {
  const st = await fetchJSON("/api/status?root=" + encodeURIComponent(currentRootLabel));
  const cached = treeCache[currentRootLabel];
  if (cached && cached.lastScan === st.lastScan) {
    fullTree = cached.tree;
  } else {
    setStatus("loading...");
    fullTree = await fetchJSON("/api/data?root=" + encodeURIComponent(currentRootLabel));
    treeCache[currentRootLabel] = { lastScan: st.lastScan, tree: fullTree };
  }
  pathStack = [fullTree];
  setStatus(st.lastScan ? "last scan: " + new Date(st.lastScan).toLocaleString() : "");
  renderBreadcrumb();
  renderCurrent();
}

function setStatus(text) {
  document.getElementById("status").textContent = text;
}

function renderBreadcrumb() {
  const el = document.getElementById("breadcrumb");
  el.innerHTML = "";
  pathStack.forEach((node, i) => {
    if (i > 0) {
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = " / ";
      el.appendChild(sep);
    }
    const span = document.createElement("span");
    span.textContent = node.name + (i === 0 ? "" : "");
    span.onclick = () => { pathStack = pathStack.slice(0, i + 1); renderBreadcrumb(); renderCurrent(); };
    el.appendChild(span);
  });
}

function renderCurrent() {
  document.getElementById("treemap").style.display = showBlocks ? "" : "none";
  document.getElementById("listView").style.display = showBlocks ? "none" : "";
  if (showBlocks) {
    renderTreemap();
  } else {
    renderList();
  }
}

function drillInto(node) {
  pathStack.push(node);
  renderBreadcrumb();
  renderCurrent();
}

function renderTreemap() {
  const node = pathStack[pathStack.length - 1];
  const container = document.getElementById("treemap");
  container.innerHTML = "";
  const children = (node.children || []).filter(c => c.size > 0);
  if (children.length === 0) {
    container.innerHTML = '<div id="empty">no children (empty directory or file)</div>';
    return;
  }
  const boxes = [];
  layout(children, 0, 0, 1000, 1000, boxes, pathStack.length);
  const rect = container.getBoundingClientRect();
  for (const b of boxes) {
    const div = document.createElement("div");
    div.className = "cell";
    div.style.left = (b.x / 10) + "%";
    div.style.top = (b.y / 10) + "%";
    div.style.width = (b.w / 10) + "%";
    div.style.height = (b.h / 10) + "%";
    div.style.background = colorFor(b.depth, b.index);
    div.title = b.node.name + " — " + fmtBytes(b.node.size) + " — modified " + fmtMTime(b.node.mtime);
    const pxW = (b.w / 1000) * rect.width;
    const pxH = (b.h / 1000) * rect.height;
    if (pxW > 40 && pxH > 14) {
      div.textContent = b.node.name + " (" + fmtBytes(b.node.size) + ")";
    }
    if (b.node.children && b.node.children.length > 0) {
      div.onclick = () => drillInto(b.node);
    }
    container.appendChild(div);
  }
}

function renderList() {
  const node = pathStack[pathStack.length - 1];
  const container = document.getElementById("listView");
  const children = [...(node.children || [])].sort((a, b) => b.size - a.size);
  if (children.length === 0) {
    container.innerHTML = '<div id="empty">no children (empty directory or file)</div>';
    return;
  }
  const maxSize = children[0].size || 1;
  const rows = children.map(c => {
    const isDir = !!(c.children && c.children.length > 0);
    const pct = Math.max((c.size / maxSize) * 100, 0.5);
    return '<tr class="' + (isDir ? "dir" : "") + '" data-name="' + escapeHtml(c.name) + '">' +
      '<td><span class="icon">' + (isDir ? "\u{1F4C1}" : "\u{1F4C4}") + '</span>' + escapeHtml(c.name) + '</td>' +
      '<td class="bar-cell"><div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%"></div></div></td>' +
      '<td class="size">' + fmtBytes(c.size) + '</td>' +
      '<td class="mtime">' + fmtMTime(c.mtime) + '</td>' +
      '</tr>';
  }).join("");
  container.innerHTML = '<table class="list"><thead><tr><th>Name</th><th>Usage</th><th>Size</th><th>Modified</th></tr></thead><tbody>' + rows + '</tbody></table>';
  container.querySelectorAll("tr.dir").forEach(tr => {
    tr.onclick = () => {
      const name = tr.getAttribute("data-name");
      const child = children.find(c => c.name === name);
      if (child) drillInto(child);
    };
  });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

// simple recursive binary-split treemap layout in a 0..1000 virtual coordinate space
function layout(nodes, x, y, w, h, out, depth, index) {
  index = index || 0;
  if (nodes.length === 0) return;
  if (nodes.length === 1) {
    out.push({ node: nodes[0], x, y, w, h, depth, index });
    return;
  }
  const weights = nodes.map(n => Math.max(n.size, 1));
  const total = weights.reduce((a, b) => a + b, 0);
  let acc = 0, splitIdx = 1;
  for (let i = 0; i < weights.length; i++) {
    acc += weights[i];
    if (acc >= total / 2) { splitIdx = i + 1; break; }
  }
  splitIdx = Math.min(Math.max(splitIdx, 1), nodes.length - 1);
  const groupA = nodes.slice(0, splitIdx);
  const groupB = nodes.slice(splitIdx);
  const sumA = weights.slice(0, splitIdx).reduce((a, b) => a + b, 0);
  const fracA = sumA / total;

  if (w >= h) {
    const wA = w * fracA;
    layout(groupA, x, y, wA, h, out, depth, index);
    layout(groupB, x + wA, y, w - wA, h, out, depth, index + splitIdx);
  } else {
    const hA = h * fracA;
    layout(groupA, x, y, w, hA, out, depth, index);
    layout(groupB, x, y + hA, w, h - hA, out, depth, index + splitIdx);
  }
}

function colorFor(depth, index) {
  const hue = (depth * 67 + index * 13) % 360;
  return "hsl(" + hue + ", 45%, 40%)";
}

document.getElementById("rescanBtn").onclick = () => triggerScan();

const showBlocksBtn = document.getElementById("showBlocksBtn");
showBlocksBtn.onclick = () => {
  showBlocks = !showBlocks;
  showBlocksBtn.setAttribute("aria-pressed", String(showBlocks));
  showBlocksBtn.textContent = showBlocks ? "Blocks" : "List";
  if (fullTree) renderCurrent();
};

window.onresize = () => { if (fullTree) renderCurrent(); };

loadRoots().catch(e => setStatus("error: " + e.message));
</script>
</body>
</html>
