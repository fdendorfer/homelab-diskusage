services:
  diskusage:
    build: .
    container_name: diskusage
    restart: unless-stopped
    mem_limit: 2g
    environment:
      # First root is the default starting point. "/" is the host root
      # filesystem (non-recursive bind — other mounted filesystems, /proc,
      # /sys etc. appear empty there, and the scanner itself stays on one
      # filesystem too, so this covers the actual system/nvme drive without
      # duplicating "seagate"). Add further external drives the same way:
      # label:/data/label, plus a matching bind mount below.
      - ROOTS=/:/data/system,seagate:/data/seagate
    volumes:
      - /:/data/system:ro
      - /mnt/seagate:/data/seagate:ro
    networks:
      - proxy

networks:
  proxy:
    external: true
